services:
  db:
    image: postgis/postgis:16-3.4
    container_name: s2id_lab_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-s2id_lab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migracoes:
    image: flyway/flyway:10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-s2id_lab}
      -user=${POSTGRES_USER:-postgres}
      -password=${POSTGRES_PASSWORD}
      -connectRetries=10
      -validateMigrationNaming=true
      migrate

volumes:
  dados_pg:
